name: Deploy My Little Library
on:
  push:
    branches: [my-little-library]
    paths:
      - 'my-little-library/**'
      - '.github/workflows/deploy-my-little-library.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: my-little-library-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-little-library/package-lock.json
      - name: Install dependencies
        working-directory: my-little-library
        run: npm ci
      - name: Build app
        working-directory: my-little-library
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: my-little-library/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
